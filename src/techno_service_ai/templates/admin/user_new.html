{% extends "base.html" %}
{% block title %}New user · Techno Service AI{% endblock %}
{% block content %}
<div class="card">
  <h2>New user</h2>
  {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
  <form method="post" action="/admin/users/new">
    <div class="form-row"><label for="username">Username</label>
      <input id="username" name="username" type="text" required autocomplete="off" /></div>
    <div class="form-row"><label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="off" /></div>
    <div class="form-row"><label for="display_name">Display name</label>
      <input id="display_name" name="display_name" type="text" required /></div>
    <div class="form-row"><label for="password">Initial password</label>
      <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password" /></div>
    <div class="form-row"><label for="recovery_question">Recovery question</label>
      <input id="recovery_question" name="recovery_question" type="text" required /></div>
    <div class="form-row"><label for="recovery_answer">Recovery answer</label>
      <input id="recovery_answer" name="recovery_answer" type="text" required /></div>
    <button class="btn" type="submit">Create user</button>
    <a class="btn secondary" href="/admin/users">Cancel</a>
  </form>
</div>
{% endblock %}
