{% extends "phase9/base.html" %}
{% block title %}Patent Watch — §4.18.4{% endblock %}
{% block content %}
<h1>Patent Watch — §4.18.4</h1>
<p class="pd-meta">SCR-PD-004. Surface patent alerts with relevance scoring.</p>

{% if error %}<div class="pd-error">{{ error }}</div>{% endif %}

<form method="post" action="/proactive/patents">
  <div class="pd-form-row">
    <label for="patent_id">Patent ID</label>
    <input id="patent_id" name="patent_id" required />
  </div>
  <div class="pd-form-row">
    <label for="title">Title</label>
    <input id="title" name="title" required />
  </div>
  <div class="pd-form-row">
    <label for="assignee">Assignee</label>
    <input id="assignee" name="assignee" />
  </div>
  <div class="pd-form-row">
    <label for="filing_date">Filing Date (ISO)</label>
    <input id="filing_date" name="filing_date" placeholder="2026-01-15" />
  </div>
  <div class="pd-form-row">
    <label for="relevance">Relevance</label>
    <select id="relevance" name="relevance">
      <option value="HIGH">HIGH</option>
      <option value="MEDIUM" selected>MEDIUM</option>
      <option value="LOW">LOW</option>
    </select>
  </div>
  <div class="pd-form-row">
    <label for="relevance_rationale">Relevance Rationale</label>
    <textarea id="relevance_rationale" name="relevance_rationale"></textarea>
  </div>
  <div class="pd-form-row">
    <label for="source_citation_url">Source Citation URL (REQUIRED)</label>
    <input id="source_citation_url" name="source_citation_url" required />
  </div>
  <button type="submit" style="padding:.5rem 1rem;background:#111827;color:#fff;border:none;border-radius:4px;">Surface Patent Alert</button>
</form>
{% endblock %}
