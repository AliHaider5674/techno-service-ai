{% extends "phase9/base.html" %}
{% block title %}{{ "patents.title" | t(lang_code()) }}{% endblock %}
{% block content %}
<h1>{{ "patents.title" | t(lang_code()) }}</h1>
<p class="pd-meta">{{ "patents.subtitle" | t(lang_code()) }}</p>

{% if error %}<div class="pd-error">{{ error }}</div>{% endif %}

<form method="post" action="/proactive/patents">
  <div class="pd-form-row">
    <label for="patent_id">{{ "patents.field.patent_id" | t(lang_code()) }}</label>
    <input id="patent_id" name="patent_id" required />
  </div>
  <div class="pd-form-row">
    <label for="title">{{ "patents.field.title" | t(lang_code()) }}</label>
    <input id="title" name="title" required />
  </div>
  <div class="pd-form-row">
    <label for="assignee">{{ "patents.field.assignee" | t(lang_code()) }}</label>
    <input id="assignee" name="assignee" />
  </div>
  <div class="pd-form-row">
    <label for="filing_date">{{ "patents.field.filing_date" | t(lang_code()) }}</label>
    <input id="filing_date" name="filing_date" placeholder="2026-01-15" />
  </div>
  <div class="pd-form-row">
    <label for="relevance">{{ "patents.field.relevance" | t(lang_code()) }}</label>
    <select id="relevance" name="relevance">
      <option value="HIGH">HIGH</option>
      <option value="MEDIUM" selected>MEDIUM</option>
      <option value="LOW">LOW</option>
    </select>
  </div>
  <div class="pd-form-row">
    <label for="relevance_rationale">{{ "patents.field.rationale" | t(lang_code()) }}</label>
    <textarea id="relevance_rationale" name="relevance_rationale"></textarea>
  </div>
  <div class="pd-form-row">
    <label for="source_citation_url">{{ "patents.field.url" | t(lang_code()) }}</label>
    <input id="source_citation_url" name="source_citation_url" required />
  </div>
  <button type="submit" style="padding:.5rem 1rem;background:#111827;color:#fff;border:none;border-radius:4px;">{{ "patents.submit" | t(lang_code()) }}</button>
</form>
{% endblock %}
