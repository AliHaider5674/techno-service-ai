{% extends "phase9/base.html" %}
{% block title %}{{ "scan.title" | t(lang_code()) }}{% endblock %}
{% block content %}
<h1>{{ "scan.title" | t(lang_code()) }}</h1>
<p class="pd-meta">{{ "scan.subtitle" | t(lang_code()) }}</p>

{% if error %}<div class="pd-error">{{ error }}</div>{% endif %}

<form method="post" action="/proactive/scan">
  <div class="pd-form-row">
    <label for="product_name">{{ "scan.field.product_name" | t(lang_code()) }}</label>
    <input id="product_name" name="product_name" required />
  </div>
  <div class="pd-form-row">
    <label for="product_category">{{ "scan.field.product_category" | t(lang_code()) }}</label>
    <select id="product_category" name="product_category">
      <option value="INDUSTRIAL_MAINTENANCE">Industrial Maintenance</option>
      <option value="OIL_GAS">Oil & Gas</option>
      <option value="PROCESS_INSTRUMENTATION">Process Instrumentation</option>
      <option value="ELECTRICAL">Electrical</option>
      <option value="MECHANICAL">Mechanical</option>
      <option value="CORROSION_PROTECTION">Corrosion Protection</option>
      <option value="OTHER">Other</option>
    </select>
  </div>
  <div class="pd-form-row">
    <label for="sector">{{ "scan.field.sector" | t(lang_code()) }}</label>
    <input id="sector" name="sector" required placeholder="e.g. Refinery Maintenance" />
  </div>
  <div class="pd-form-row">
    <label for="manufacturer_name">{{ "scan.field.manufacturer_name" | t(lang_code()) }}</label>
    <input id="manufacturer_name" name="manufacturer_name" required />
  </div>
  <div class="pd-form-row">
    <label for="manufacturer_country">{{ "scan.field.manufacturer_country" | t(lang_code()) }}</label>
    <input id="manufacturer_country" name="manufacturer_country" />
  </div>
  <div class="pd-form-row">
    <label for="discovery_source">{{ "scan.field.discovery_source" | t(lang_code()) }}</label>
    <select id="discovery_source" name="discovery_source">
      <option value="WEB_SEARCH">Web Search</option>
      <option value="TRADE_PUBLICATION">Trade Publication</option>
      <option value="PATENT">Patent</option>
      <option value="EXHIBITION">Exhibition</option>
      <option value="REFERRAL">Referral</option>
      <option value="PARTNER">Partner</option>
    </select>
  </div>
  <div class="pd-form-row">
    <label for="source_citation_url">{{ "scan.field.source_citation_url" | t(lang_code()) }}</label>
    <input id="source_citation_url" name="source_citation_url" required placeholder="https://..." />
  </div>
  <div class="pd-form-row">
    <label for="signal_strength">{{ "scan.field.signal_strength" | t(lang_code()) }}</label>
    <select id="signal_strength" name="signal_strength">
      <option value="HIGH">HIGH</option>
      <option value="MEDIUM" selected>MEDIUM</option>
      <option value="LOW">LOW</option>
    </select>
  </div>
  <div class="pd-form-row">
    <label for="notes">{{ "scan.field.notes" | t(lang_code()) }}</label>
    <textarea id="notes" name="notes"></textarea>
  </div>
  <button type="submit" style="padding:.5rem 1rem;background:#111827;color:#fff;border:none;border-radius:4px;">{{ "scan.submit" | t(lang_code()) }}</button>
</form>
{% endblock %}
