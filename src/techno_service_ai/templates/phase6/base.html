<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title or "Phase 6" }} — {{ app_name }}</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <style>
    .phase6 { max-width: 1200px; margin: 0 auto; padding: 1rem; }
    .phase6 h1 { font-size: 1.4rem; margin: 0.5rem 0; }
    .phase6 h2 { font-size: 1.1rem; margin: 1rem 0 0.3rem; border-bottom: 1px solid #ddd; padding-bottom: 4px; }
    .phase6 h3 { font-size: 1rem; margin: 0.8rem 0 0.2rem; color: #445; }
    .phase6 .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; background: #eef; color: #224; }
    .phase6 .badge.open, .phase6 .badge.qualified, .phase6 .badge.awarded, .phase6 .badge.won, .phase6 .badge.published, .phase6 .badge.permanent, .phase6 .badge.submitted { background: #dfd; color: #060; }
    .phase6 .badge.closed, .phase6 .badge.lost, .phase6 .badge.expired, .phase6 .badge.cancelled, .phase6 .badge.draft, .phase6 .badge.reviewed { background: #ffd; color: #880; }
    .phase6 .badge.rejected, .phase6 .badge.deprecated, .phase6 .badge.short_term, .phase6 .badge.not_qualified { background: #fdd; color: #800; }
    .phase6 .badge.conditionally_qualified, .phase6 .badge.in_progress, .phase6 .badge.on_hold, .phase6 .badge.completed, .phase6 .badge.disputed { background: #ffd; color: #880; }
    .phase6 .badge.long_term, .phase6 .badge.standard { background: #eef; color: #224; }
    .phase6 table { width: 100%; border-collapse: collapse; margin: 0.5rem 0; }
    .phase6 th, .phase6 td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; }
    .phase6 th { background: #f6f6f9; }
    .phase6 .constitutional { border: 1px solid #ccd; padding: 0.5rem 1rem; margin: 0.5rem 0; background: #fafafd; }
    .phase6 .principal { font-size: 0.9rem; color: #555; margin-bottom: 1rem; }
    .phase6 .kpi { display: inline-block; padding: 1rem 1.5rem; margin: 0.5rem; background: #f6f6f9; border-radius: 6px; }
    .phase6 .kpi .n { font-size: 1.6rem; font-weight: 600; }
    .phase6 .kpi .label { font-size: 0.85rem; color: #555; }
    .phase6 .zone { border: 1px solid #ddd; padding: 0.6rem; margin: 0.4rem 0; background: #fff; }
    .phase6 .zone .ztitle { font-size: 0.85rem; color: #777; margin-bottom: 0.3rem; }
    .phase6 .empty { color: #888; font-style: italic; padding: 1rem; }
  </style>
</head>
<body>
  <div class="phase6">
    <h1>{{ title or "Phase 6" }}</h1>
    {% if principal %}
    <div class="principal">Signed in as <strong>{{ principal.display_name }}</strong> ({{ principal.username }}) — roles: {{ principal.role_codes | join(", ") }}</div>
    {% endif %}
    {% block body %}{% endblock %}
    <hr />
    <p>
      <a href="/">← Home</a> ·
      <a href="/tenders">Tenders</a> ·
      <a href="/projects">Projects</a> ·
      <a href="/knowledge">Knowledge</a> ·
      <a href="/lessons-learned">Lessons Learned</a> ·
      <a href="/institutional-memory">Institutional Memory</a>
    </p>
  </div>
</body>
</html>
