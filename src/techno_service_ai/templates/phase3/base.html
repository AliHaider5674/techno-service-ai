<!doctype html>
<html lang="{{ lang_code() }}" dir="{{ dir_attr() }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title or "Phase 3" }} — {{ app_name }}</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <style>
    .phase3 { max-width: 1100px; margin: 0 auto; padding: 1rem; }
    .phase3 h1 { font-size: 1.4rem; margin: 0.5rem 0; }
    .phase3 h2 { font-size: 1.1rem; margin: 1rem 0 0.3rem; }
    .phase3 .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; background: #eef; color: #224; }
    .phase3 .badge-class-4 { background: #fdd; color: #800; }
    .phase3 .badge-class-3 { background: #fed; color: #840; }
    .phase3 .badge-class-2 { background: #ffd; color: #880; }
    .phase3 .badge-class-1 { background: #efd; color: #080; }
    .phase3 table { width: 100%; border-collapse: collapse; margin: 0.5rem 0; }
    .phase3 th, .phase3 td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; }
    .phase3 th { background: #f6f6f9; }
    .phase3 .constitutional { border: 1px solid #ccd; padding: 0.5rem 1rem; margin: 0.5rem 0; background: #fafafd; }
    .phase3 .principal { font-size: 0.9rem; color: #555; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="phase3">
    <h1>{{ title or "Phase 3" }}</h1>
    {% if principal %}
    <div class="principal">Signed in as <strong>{{ principal.display_name }}</strong> ({{ principal.username }}) — roles: {{ principal.role_codes | join(", ") }}</div>
    {% endif %}
    {% block body %}{% endblock %}
    <hr />
    <p><a href="/">← Home</a></p>
  </div>
</body>
</html>
