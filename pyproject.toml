[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "techno-service-ai"
version = "1.0.0a1"
description = "Techno Service AI Intelligence System — Phase 1: Identity, Access, and Audit Foundation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "Implementation Engineer"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: FastAPI",
    "Topic :: Office/Business",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.0",
    "pyjwt[crypto]>=2.8",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
tsai-bootstrap = "techno_service_ai.bootstrap:main"
tsai-serve = "techno_service_ai.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
